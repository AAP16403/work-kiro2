[package]
name = "plouto_rs"
version = "0.1.0"
edition = "2021"
description = "PLOUTO (Stellar Survival) - High-performance multi-core & GPU Rust rewrite"
autobins = false

[[bin]]
name = "plouto"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
ab_glyph = "0.2"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
hound = "3.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = "0.4"
rand = "0.8"
rand_chacha = "0.3"
tempfile = "3.14"
ico = "0.3"
gilrs = "0.11"

